<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 320" width="1800" height="320">
  <defs>
    <linearGradient id="chalkboardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#191919"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7ff69"/>
      <stop offset="50%" stop-color="#7a78ff"/>
      <stop offset="100%" stop-color="#ff6d38"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="160" cy="160" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c7ff69" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#7a78ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="0"/>
    </radialGradient>
    <pattern id="chalkGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252525" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background Surface -->
  <rect width="1800" height="320" rx="20" fill="url(#chalkboardBg)"/>
  <rect width="1800" height="320" rx="20" fill="url(#chalkGrid)"/>
  <rect width="1800" height="320" rx="20" fill="url(#auraGlow)"/>

  <!-- Outer Frame -->
  <rect width="1796" height="316" x="2" y="2" rx="18" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <rect width="1740" height="3" x="30" y="2" fill="url(#limeGrad)"/>

  <!-- Official Cline Mascot Tile -->
  <g transform="translate(80, 80)">
    <rect width="160" height="160" rx="25" fill="#232323" stroke="#333333" stroke-width="2"/>
    <g transform="translate(25, 20) scale(1.15)">
      <!-- Official Antenna -->
      <circle cx="45.735" cy="11" r="11" fill="#c7ff69" />
      <!-- Official Head -->
      <path d="M65.449 16.3C76.337 16.3 85.164 25.165 85.164 36.1v6.6l5.739 11.465c.567 1.132.564 2.465-.007 3.595L85.164 69.1v6.6c0 10.936-8.827 19.8-19.715 19.8H26.021C15.133 95.5 6.306 86.636 6.306 75.7v-6.6L.449 57.795c-.596-1.149-.598-2.515-.008-3.666L6.306 42.7v-6.6C6.306 25.165 15.133 16.3 26.021 16.3h39.428z" fill="#fdf9f0" />
      <!-- Official Eyes -->
      <rect fill="#141414" x="28" y="44.5" width="10" height="20" rx="4" />
      <rect fill="#141414" x="54" y="44.5" width="10" height="20" rx="4" />
    </g>
  </g>

  <!-- Typography & Badges -->
  <g transform="translate(280, 135)">
    <text x="0" y="0" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#fdf9f0" letter-spacing="-1.5px">Cline Marketplace</text>
    <text x="560" y="-3" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#c7ff69" letter-spacing="1.5">// LOCAL CONTROL PLANE</text>
    
    <text x="0" y="46" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="500" fill="#a0a0a0">Official Primitive Registry · Zero Telemetry · Live FS Reconciler · Instant CLI Integration</text>
  </g>

  <!-- Stat Pills in Banner -->
  <g transform="translate(280, 225)">
    <!-- Pill 1 -->
    <rect width="180" height="34" rx="17" fill="#232323" stroke="#333333" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="4.5" fill="#c7ff69"/>
    <text x="36" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#fdf9f0">250+ PRIMITIVES</text>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="195" height="34" rx="17" fill="#232323" stroke="#333333" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="4.5" fill="#7a78ff"/>
      <text x="36" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#fdf9f0">PLUGINS &amp; SKILLS</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(405, 0)">
      <rect width="170" height="34" rx="17" fill="#232323" stroke="#333333" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="4.5" fill="#ffc412"/>
      <text x="36" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#fdf9f0">MCP SERVERS</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(590, 0)">
      <rect width="210" height="34" rx="17" fill="#232323" stroke="#333333" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="4.5" fill="#00a652"/>
      <text x="36" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#fdf9f0">WORKSPACE SCOPED</text>
    </g>
  </g>
</svg>