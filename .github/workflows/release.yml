name: Release & Version Automation

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install dependencies & Test Gate
        run: |
          npm ci
          npm test

      - name: Determine tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes & Changelog
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag_info.outputs.tag }}';
            return `### Cline Marketplace Local Control Plane — ${tag}\n\n` +
                   `- High-performance local catalog browser for Cline plugins, skills, and MCP servers.\n` +
                   `- Dynamic port binding and zero-configuration runner.\n` +
                   `- Live filesystem reconciler and drift detection.\n` +
                   `- Real-time workspace stack heuristics and curated toolchains.\n\n` +
                   `**Full Changelog**: https://github.com/${context.repo.owner}/${context.repo.repo}/commits/${tag}`;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Cline Marketplace ${{ steps.tag_info.outputs.tag }}"
          body: ${{ steps.release_notes.outputs.result }}
          draft: false
          prerelease: false
          generate_release_notes: true
