name: Upstream Catalog Synchronization

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Fetch & Commit Upstream Marketplace Catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pull latest upstream catalog and metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-catalog.mjs

      - name: Check for catalog modifications
        id: git_diff
        run: |
          git status --porcelain catalog.json data/
          if [[ -n $(git status --porcelain catalog.json data/) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated catalog
        if: steps.git_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f is deliberate: data/*.json is locally gitignored except tracked
          # sync artifacts; force-add documents that intent (audit 2026-09-05 LOW-04).
          git add -f catalog.json data/upstream-meta.json data/catalog-prev.json
          git commit -m "chore(catalog): automated sync with upstream cline/marketplace [skip ci]"
          git push origin main
