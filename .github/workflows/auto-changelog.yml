name: "Release from CHANGELOG"

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "package.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (must match CHANGELOG header, e.g. 1.2.3). Leave empty to auto-detect."
        required: false
        type: string

permissions:
  contents: write

# Only run on the canonical repository.
jobs:
  release:
    if: github.repository == 'Mateo-Piedra22/ClineMarket'
    name: Tag & Publish GitHub Release from CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1. Extract the top-most version header from CHANGELOG.md.
      #    Accepted form: "## [X.Y.Z] - YYYY-MM-DD" (date optional).
      - name: Parse Top Version From CHANGELOG
        id: parse
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "${VERSION:-}" ]; then
            VERSION=$(node -e "const fs=require('fs'); const t=fs.readFileSync('CHANGELOG.md','utf8'); const m=t.match(/^##\s*\[(\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?)\]/m); if(!m){console.error('No version header found in CHANGELOG.md'); process.exit(1)} console.log(m[1]);")
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}"

      - name: Read package.json Version
        id: pkg
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "pkg_version=${PKG_VERSION}" >> $GITHUB_OUTPUT
          echo "package.json version: ${PKG_VERSION}"

      # 2. If CHANGELOG version does not match package.json, bump it
      #    and push (so both are the single source of truth).
      - name: Sync package.json to CHANGELOG Version
        if: steps.parse.outputs.version != steps.pkg.outputs.pkg_version
        run: |
          set -euo pipefail
          TARGET="${{ steps.parse.outputs.version }}"
          CURRENT="${{ steps.pkg.outputs.pkg_version }}"
          echo "Bumping package.json: ${CURRENT} -> ${TARGET}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');" "${TARGET}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version to ${TARGET} [skip ci]"
          git push origin main

      # 3. Idempotency: skip tag creation if it already exists.
      - name: Check Tag Does Not Already Exist
        id: check_tag
        run: |
          set -euo pipefail
          TAG="v${{ steps.parse.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::warning::Tag ${TAG} already exists; will not recreate it but will refresh the GitHub release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Annotated Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          TAG="v${{ steps.parse.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG} (auto from CHANGELOG.md)"
          git push origin "${TAG}"

      # 4. Extract release notes (section under "## [X.Y.Z]") to a file.
      - name: Extract Release Notes From CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.parse.outputs.version }}"
          node -e "const fs=require('fs'); const t=fs.readFileSync('CHANGELOG.md','utf8'); const v=process.argv[1]; const re=new RegExp('^##\\s*\\['+v.replace(/\\./g,'\\\\.')+'\\][^\\n]*\\n([\\s\\S]*?)(?=^##\\s*\\[|^---$)','m'); const m=t.match(re); if(!m){console.error('No section for version '+v+' in CHANGELOG.md'); process.exit(1)} process.stdout.write(m[1].trim()+'\n');" "${VERSION}" > release_notes.md
          echo "First 5 lines of release_notes.md:"
          head -n 5 release_notes.md | sed 's/^/  | /'

      # 5. Publish/refresh the GitHub Release with the extracted body.
      #    softprops/action-gh-release is idempotent on tag.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.parse.outputs.version }}
          name: "Cline Marketplace v${{ steps.parse.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.parse.outputs.version, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Done
        if: always()
        run: |
          echo "Released v${{ steps.parse.outputs.version }}"
          echo "Tag existed before: ${{ steps.check_tag.outputs.exists }}"
