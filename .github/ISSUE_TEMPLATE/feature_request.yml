name: Feature Request
description: Suggest an enhancement, new primitive integration, or automation
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature or improvement? Let us know!
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: A clear and concise description of what you want to achieve.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Design
      description: How you envision this working.
    validations:
      required: false
